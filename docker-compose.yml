services:
  plex-playlist-sync:
    image: ghcr.io/mayberts/plex-playlist-sync:latest
    # To build locally instead of pulling the published image, comment out
    # the `image:` line above and uncomment the next line:
    # build: .
    container_name: plex-playlist-sync
    restart: unless-stopped
    env_file:
      - .env
    # If your Plex server is ALSO a Docker container on this same host and
    # you normally reach it by container name rather than an IP address,
    # uncomment the next two lines and put that container on the same
    # network (adjust the network name to match your setup):
    # networks:
    #   - plex_net

# networks:
#   plex_net:
#     external: true
